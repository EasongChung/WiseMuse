name: wisemuse
description: "智启陪读 WiseMuse：儿童学习助手 —— 教材识别、朗读、跟读验证、听写与生词复习。"
publish_to: 'none'

# 版本号由 CI 注入（--build-name/--build-number），此处为开发基线。
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  # 数据层（精确锁定，兼容 Flutter 3.44.9 / Dart 3.12）
  sqflite: 2.4.3
  shared_preferences: 2.5.5
  path_provider: 2.1.5
  path_provider_android: 2.2.16
  path: 1.9.1
  # 录音权限（跟读/听写）
  permission_handler: 13.0.0
  # 文件选择（模型导入）
  file_picker: 12.0.0-beta.7
  # 模型下载与解压
  http: 1.6.0
  archive: 4.0.9
  # 跟读评分：汉字转拼音（音近容错），纯离线无传递依赖
  pinyin: 3.3.0
  # Phase 2 导入与识别：
  # docx 解析（zip 内 word/document.xml 的 WordprocessingML），与 archive 4.x 兼容
  xml: 6.6.1
  # Word 原文模式（docx→HTML 后 WebView 渲染）；Android 实现为纯 Java，无 AGP9 KGP 风险
  webview_flutter: 4.14.1
  flutter_markdown: 0.7.7+1
  # 设置页 GitHub 链接（浏览器打开）
  url_launcher: 6.3.1
  # 运行时版本号（设置页底部展示）
  package_info_plus: 10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  # 单测内存库（桌面/测试环境跑 sqflite）
  sqflite_common_ffi: 2.4.2

flutter:
  uses-material-design: true

  assets:
    # [v0.1.56] 设置页底部 GitHub 仓库图标
    - assets/icons/github.png

  # [v0.3.0] UI 重设计「暖色书房」：标题字体站酷快乐体（圆体童趣），打包进 assets 离线可用。
  fonts:
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
