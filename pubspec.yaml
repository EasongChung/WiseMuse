name: wisemuse
description: "智启陪读 WiseMuse：儿童学习助手 —— 教材识别、朗读、跟读验证、听写与生词复习。"
publish_to: 'none'

# 版本号由 CI 注入（--build-name/--build-number），此处为开发基线。
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  # 数据层（精确锁定兼容 Flutter 3.29.3 / Dart 3.7.2）
  sqflite: 2.4.2
  shared_preferences: 2.5.3
  path_provider: 2.1.5
  path_provider_android: 2.2.16
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  # 单测内存库（桌面/测试环境跑 sqflite）
  sqflite_common_ffi: 2.3.6

flutter:
  uses-material-design: true
