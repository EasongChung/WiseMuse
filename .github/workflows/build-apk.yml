name: Build Android APK & Release

# [v0.1.0] 正式线：push 到 main 自动构建发布。构建成功后自动创建
# v0.1.<N>-<时间> 标签并发布 Release（附 APK）。不再用 tags: ['v*'] 触发器，
# 否则「自动推 tag」会再次触发构建形成无限循环。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 全量拉取历史与 tags, 用于计算本次版本号(已发布最大 0.1.x +1)
          fetch-depth: 0

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: 检查工具链
        run: |
          flutter --version
          java -version
          ./android/gradlew --version

      # 计算本次构建版本号: 取已发布最大 v0.1.x 自动 +1(无则 0.1.1)。
      # 通过 flutter build --build-name/--build-number 注入, 不改动 pubspec(避免循环触发)。
      - name: 计算并注入版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MAX=$(git tag -l 'v0.1.*' | sed -E 's/^v0\.1\.([0-9]+).*/\1/' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$MAX" ]; then MAX=0; fi
          VERSION="0.1.$((MAX + 1))"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "本次构建版本: ${VERSION}"

      - name: 按锁文件获取依赖
        run: flutter pub get

      - name: 检查 Dart 格式
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态分析
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 运行测试
        run: flutter test

      # ===== llama 本地 LLM 引擎装配（Release + 版本引用小文件）=====
      # 与 test-apk.yml 同款：android/llama_engine.txt 记录引擎 Release tag，
      # 构建前下载引擎 tarball 塞 jniLibs 随 APK 打包；未配置则跳过。
      - name: 装配 llama 引擎 .so
        shell: bash
        run: |
          set -euo pipefail
          REF="android/llama_engine.txt"
          if [ -f "$REF" ]; then
            TAG="$(grep -v '^[[:space:]]*#' "$REF" | tail -1 | tr -d '[:space:]')"
          else
            TAG=""
          fi
          if [ -z "$TAG" ] || [[ "$TAG" != llama-engine-* ]]; then
            echo "::warning::未配置有效的引擎 tag（android/llama_engine.txt），本次构建不带本地 LLM 引擎"
            exit 0
          fi
          echo "==> 下载引擎 Release: $TAG"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'llama-engine-*.tar.gz' \
            --dir /tmp/llama-engine || {
              echo "::error::引擎 Release $TAG 下载失败"
              exit 1
            }
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          tar -xzf /tmp/llama-engine/llama-engine-*.tar.gz -C /tmp/llama-engine
          cp /tmp/llama-engine/engine/*.so android/app/src/main/jniLibs/arm64-v8a/
          echo "==> 引擎 .so 装配完成："
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
        env:
          GH_TOKEN: ${{ github.token }}

      # ===== 签名配置（与本项目此前工程同款方案）=====
      # 如果 Secrets 已配置 KEYSTORE_BASE64，直接解码还原 keystore 复用签名；
      # 否则首次运行自动生成 keystore，并将 keystore+密码打包为 artifact 供下载，
      # 下载后填入仓库 Secrets 即可实现后续构建复用同一签名（可覆盖安装）。
      # Secrets 配置路径：仓库 → Settings → Secrets and variables → Actions
      #   KEYSTORE_BASE64: 首次下载的 keystore.jks 用 `base64 -w0 keystore.jks` 编码
      #   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD: 与首次生成时一致
      - name: 配置签名 keystore
        id: configure-keystore
        run: |
          mkdir -p $HOME/.android
          if echo "${{ secrets.KEYSTORE_BASE64 }}" | grep -q '.'; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/.android/wise-muse-keystore.jks
            echo "KEYSTORE_PATH=$HOME/.android/wise-muse-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "new_keystore=false" >> $GITHUB_OUTPUT
            echo "Keystore restored from secrets"
          else
            KEYSTORE_PWD="WiseMuse$(date +%s)"
            KEY_PWD="WiseMuse$(date +%s)"
            KEY_ALIAS="wise-muse"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PWD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PWD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$HOME/.android/wise-muse-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PWD}" > $HOME/.android/keystore-credentials.txt
            echo "KEY_PASSWORD=${KEY_PWD}" >> $HOME/.android/keystore-credentials.txt
            echo "KEY_ALIAS=${KEY_ALIAS}" >> $HOME/.android/keystore-credentials.txt
            keytool -genkey -v \
              -keystore $HOME/.android/wise-muse-keystore.jks \
              -alias ${KEY_ALIAS} \
              -storepass ${KEYSTORE_PWD} \
              -keypass ${KEY_PWD} \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -dname "CN=WiseMuse, OU=Development, O=EasongChung, L=Unknown, ST=Unknown, C=CN"
            echo "new_keystore=true" >> $GITHUB_OUTPUT
            echo "New keystore generated"
          fi

      - name: 构建 arm64 Release APK
        # 注入递增版本号: versionName=0.1.x, versionCode=末位x(单调递增, 可覆盖安装)
        # 注意: 不得使用反斜杠续行, YAML 普通标量会把换行折成空格,
        # 导致 bash 把 '\ --build-name' 解析为带前导空格的字面参数而失败。
        run: flutter build apk --release --target-platform android-arm64 --build-name "$VERSION" --build-number "${VERSION##*.}"
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: 校验并重命名 APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$SOURCE"
          test -n "$VERSION"
          DEST="build/app/outputs/flutter-apk/wisemuse-${VERSION}-${GITHUB_SHA::7}-arm64-v8a.apk"
          mv "$SOURCE" "$DEST"
          sha256sum "$DEST"
          ls -lh "$DEST"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: wisemuse-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/wisemuse-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      # 首次构建（本次生成了新 keystore）时导出 keystore + 密码，供配置 Secrets 使用
      - name: 导出 keystore（仅首次生成时）
        if: steps.configure-keystore.outputs.new_keystore == 'true'
        run: |
          cd $HOME/.android
          tar -czf keystore-package.tar.gz wise-muse-keystore.jks keystore-credentials.txt 2>/dev/null || true
          echo "KEYSTORE_PACKAGE_PATH=$HOME/.android/keystore-package.tar.gz" >> $GITHUB_ENV

      - name: 上传 keystore 包（仅首次生成时）
        if: steps.configure-keystore.outputs.new_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wise-muse-keystore-first-time
          path: ${{ env.KEYSTORE_PACKAGE_PATH }}
          retention-days: 30
          if-no-files-found: ignore

      # 每次构建成功后自动创建 v<version>-<时间> 标签并推送,
      # 时间戳(UTC, 秒级)保证每次 push 的 tag 唯一, 互不覆盖
      - name: 创建并推送版本标签
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          TS="$(date -u '+%Y%m%d-%H%M%S')"
          TAG="v${VERSION}-${TS}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag -f "${TAG}"
          git push origin "refs/tags/${TAG}" --force

      # 无条件发布 Release。TAG 含秒级时间戳保证唯一,
      # 每次 push 都是新 Release, 无需 update(softprops@v2 无该输入)。
      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: WiseMuse ${{ env.TAG }}
          body: |
            WiseMuse Android APK
            版本: ${{ env.TAG }}
            架构: arm64-v8a
            构建日期: ${{ steps.tag.outputs.date }}
            工作流: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: build/app/outputs/flutter-apk/wisemuse-*-arm64-v8a.apk
          draft: false
          prerelease: false
