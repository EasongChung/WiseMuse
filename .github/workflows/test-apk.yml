name: WiseMuse Test APK

# [v0.1.0] 开发阶段**测试版**打包线，与正式线 build-apk.yml 隔离。
#
# 仅 workflow_dispatch 手动触发（开发阶段不绑定自动 push，避免与正式线在
# main 上双构建）；有开发分支后可追加 push 自动触发。
#
# 版本号走独立测试编号 `0.1.0-test.N`（N = 已发布测试版数 +1），
# 标签前缀 `test-`，不占用 `v0.1.*` 命名空间。
# Release 一律 `prerelease: true`。
#
# versionCode 从 900 起算（高于正式线，可覆盖安装；正式线为末位数字递增）。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要全量 tags 来计算本次测试版编号
          fetch-depth: 0

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: 检查工具链
        run: flutter --version

      # 测试版编号独立计数：取已发布最大 test-<N> 自动 +1（无则 1）。
      # 不改 pubspec —— 与正式线同理，改了会形成 push→构建→push 的循环。
      - name: 计算测试版编号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MAX=$(git tag -l 'test-*' | sed -E 's/^test-([0-9]+).*/\1/' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$MAX" ]; then MAX=0; fi
          N=$((MAX + 1))
          echo "BUILD_N=${N}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.0-test.${N}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((900 + N))" >> "$GITHUB_ENV"
          echo "本次测试版: 0.1.0-test.${N} (versionCode $((900 + N)))"

      - name: 按锁文件获取依赖
        run: flutter pub get

      - name: 检查 Dart 格式
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态分析
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 运行测试
        run: flutter test

      - name: 配置签名 keystore
        run: |
          mkdir -p $HOME/.android
          if echo "${{ secrets.KEYSTORE_BASE64 }}" | grep -q '.'; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/.android/wise-muse-keystore.jks
            echo "KEYSTORE_PATH=$HOME/.android/wise-muse-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Keystore restored from secrets"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，将用临时签名，无法覆盖安装正式版"
          fi

      # ===== [双包策略阶段 1] 构建 Standard 标准测试版 (~75MB，轻量化首选) =====
      - name: 清理 jniLibs 并构建 Standard 标准版 APK
        run: |
          rm -rf android/app/src/main/jniLibs/arm64-v8a/*
          flutter build apk --release --target-platform android-arm64 --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: 校验并重命名 Standard 标准版 APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$SOURCE"
          test -n "$VERSION_NAME"
          DEST="build/app/outputs/flutter-apk/wisemuse-${VERSION_NAME}-${GITHUB_SHA::7}-standard-arm64-v8a.apk"
          mv "$SOURCE" "$DEST"
          sha256sum "$DEST"
          ls -lh "$DEST"

      # ===== [双包策略阶段 2] 装配 llama 本地引擎并构建 Full 增强测试版 (~181MB，完全离线) =====
      - name: 装配 llama 引擎 .so 并构建 Full 增强版 APK
        shell: bash
        run: |
          set -euo pipefail
          REF="android/llama_engine.txt"
          if [ -f "$REF" ]; then
            TAG="$(grep -v '^[[:space:]]*#' "$REF" | tail -1 | tr -d '[:space:]')"
          else
            TAG=""
          fi
          if [ -z "$TAG" ] || [[ "$TAG" != llama-engine-* ]]; then
            echo "::warning::未配置有效的引擎 tag（android/llama_engine.txt），跳过 Full 版构建"
            exit 0
          fi
          echo "==> 下载引擎 Release: $TAG"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'llama-engine-*.tar.gz' \
            --dir /tmp/llama-engine || {
              echo "::error::引擎 Release $TAG 下载失败"
              exit 1
            }
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          tar -xzf /tmp/llama-engine/llama-engine-*.tar.gz -C /tmp/llama-engine
          cp /tmp/llama-engine/engine/*.so android/app/src/main/jniLibs/arm64-v8a/
          echo "==> 引擎 .so 装配完成："
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

          echo "==> 开始构建 Full 增强版 APK"
          flutter build apk --release --target-platform android-arm64 --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"

          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$SOURCE"
          DEST="build/app/outputs/flutter-apk/wisemuse-${VERSION_NAME}-${GITHUB_SHA::7}-full-arm64-v8a.apk"
          mv "$SOURCE" "$DEST"
          sha256sum "$DEST"
          ls -lh "$DEST"
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: wisemuse-test-${{ github.sha }}
          path: build/app/outputs/flutter-apk/wisemuse-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: 创建并推送测试版标签
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUILD_N"
          TS="$(date -u '+%Y%m%d-%H%M%S') prime"
          TS="$(date -u '+%Y%m%d-%H%M%S')"
          TAG="test-${BUILD_N}-${TS}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag -f "${TAG}"
          git push origin "refs/tags/${TAG}" --force

      # prerelease: true —— 测试版不得占据 Latest。
      - name: 发布到 Releases（预发布）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "[测试版] WiseMuse ${{ env.VERSION_NAME }}"
          body: |
            ## WiseMuse 测试版（双包架构：Standard 标准版 + Full 增强版）

            - 版本: `${{ env.VERSION_NAME }}` (versionCode `${{ env.VERSION_CODE }}`)
            - 架构: arm64-v8a
            - 分支: `${{ github.ref_name }}` @ `${{ github.sha }}`
            - 构建日期: ${{ steps.tag.outputs.date }}
            - 工作流: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---

            ### 📦 测试包文件
            - **标准版 (Standard, ~75MB)**: `wisemuse-${{ env.VERSION_NAME }}-${{ github.sha }}-standard-arm64-v8a.apk`（日常推荐，轻量化）
            - **增强版 (Full, ~181MB)**: `wisemuse-${{ env.VERSION_NAME }}-${{ github.sha }}-full-arm64-v8a.apk`（内置完整 llama.android 离线推理库）

            ### 使用须知
            本包 versionCode 高于正式版，**装过本包后要装回正式版须先卸载**。
          files: build/app/outputs/flutter-apk/wisemuse-*-arm64-v8a.apk
          draft: false
          prerelease: true
